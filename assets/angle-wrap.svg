<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">One turn wraps; software total continues</title>
<desc id="desc">Five idealized discrete forward samples near zero, not exact silicon wrap timing: ANGLE counts 3968, 4032, 0, 64 and 128. Wrapped angles are 348.75, 354.375, 0, 5.625 and 11.25 degrees; tracked totals are 348.75, 354.375, 360, 365.625 and 371.25 degrees. Each fifteen-second loop replays this same crossing. Reduced motion shows the crossing sample. Assumes default full-turn hardware mapping, software zero at count zero, inversion off and forward motion already tracked.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3} .muted{fill:#aebed0;font-size:16px} .label{font-size:18px} .value{font-size:32px;font-weight:700} .frame{visibility:hidden;animation:show 15s steps(1,end) infinite}.f1{visibility:visible;animation-name:first}.f2{animation-delay:3s}.f3{animation-delay:6s}.f4{animation-delay:9s}.f5{animation-delay:12s}@keyframes show{0%{visibility:visible}20%,100%{visibility:hidden}}@keyframes first{0%{visibility:visible}20%,100%{visibility:hidden}}@media(prefers-reduced-motion:reduce){.frame{animation:none;visibility:hidden}.f3{visibility:visible}}
</style>
<rect width="960" height="500" rx="20" fill="#101c2d"/>
<text x="32" y="45" font-size="26" font-weight="700">One turn wraps. Software total continues.</text>
<text x="32" y="75" class="muted">Idealized forward samples · each loop replays the same crossing</text>
<rect x="32" y="100" width="310" height="298" rx="14" fill="#182b40"/>
<text x="56" y="132" class="label">Magnet above the sensor</text>
<circle cx="187" cy="255" r="91" fill="none" stroke="#8093a8" stroke-width="2"/>
<path d="M187 154v20" stroke="#f2bd68" stroke-width="4"/>
<text x="204" y="171" class="muted">0° / 360°</text>
<text x="56" y="374" class="muted">Top view · steps enlarged in time</text>
<rect x="366" y="100" width="562" height="142" rx="14" fill="#182b40"/>
<text x="390" y="133" class="label">CHIP · single-turn ANGLE</text>
<rect x="366" y="256" width="562" height="142" rx="14" fill="#18352f"/>
<text x="390" y="289" class="label">DRIVER RAM · accumulated angle</text>
<g class="frame f1">
<g transform="rotate(348.75 187 255)"><circle cx="187" cy="255" r="53" fill="#253e55" stroke="#aebed0" stroke-width="2"/><path d="M187 202 A53 53 0 0 1 187 308Z" fill="#437e93"/><text x="161" y="262" font-size="19">S</text><text x="203" y="262" font-size="19">N</text><path d="M187 251V188m-7 10 7-10 7 10" stroke="#f2bd68" stroke-width="4" fill="none"/></g>
<text x="390" y="180" class="value">348.75°</text><text x="390" y="216" class="muted">Count 3968 / 4096 · sample 1 of 5</text>
<text x="390" y="336" class="value" style="fill:#8be0ba">348.75°</text><text x="390" y="372" class="muted">Approaching the end of the first turn</text>
</g>
<g class="frame f2">
<g transform="rotate(354.375 187 255)"><circle cx="187" cy="255" r="53" fill="#253e55" stroke="#aebed0" stroke-width="2"/><path d="M187 202 A53 53 0 0 1 187 308Z" fill="#437e93"/><text x="161" y="262" font-size="19">S</text><text x="203" y="262" font-size="19">N</text><path d="M187 251V188m-7 10 7-10 7 10" stroke="#f2bd68" stroke-width="4" fill="none"/></g>
<text x="390" y="180" class="value">354.375°</text><text x="390" y="216" class="muted">Count 4032 / 4096 · sample 2 of 5</text>
<text x="390" y="336" class="value" style="fill:#8be0ba">354.375°</text><text x="390" y="372" class="muted">Approaching the end of the first turn</text>
</g>
<g class="frame f3">
<g transform="rotate(0 187 255)"><circle cx="187" cy="255" r="53" fill="#253e55" stroke="#aebed0" stroke-width="2"/><path d="M187 202 A53 53 0 0 1 187 308Z" fill="#437e93"/><text x="161" y="262" font-size="19">S</text><text x="203" y="262" font-size="19">N</text><path d="M187 251V188m-7 10 7-10 7 10" stroke="#f2bd68" stroke-width="4" fill="none"/></g>
<text x="390" y="180" class="value">0°</text><text x="390" y="216" class="muted">Count 0 / 4096 · sample 3 of 5</text>
<text x="390" y="336" class="value" style="fill:#8be0ba">360°</text><text x="390" y="372" class="muted">Crossing detected: add one revolution</text>
</g>
<g class="frame f4">
<g transform="rotate(5.625 187 255)"><circle cx="187" cy="255" r="53" fill="#253e55" stroke="#aebed0" stroke-width="2"/><path d="M187 202 A53 53 0 0 1 187 308Z" fill="#437e93"/><text x="161" y="262" font-size="19">S</text><text x="203" y="262" font-size="19">N</text><path d="M187 251V188m-7 10 7-10 7 10" stroke="#f2bd68" stroke-width="4" fill="none"/></g>
<text x="390" y="180" class="value">5.625°</text><text x="390" y="216" class="muted">Count 64 / 4096 · sample 4 of 5</text>
<text x="390" y="336" class="value" style="fill:#8be0ba">365.625°</text><text x="390" y="372" class="muted">One revolution + current angle</text>
</g>
<g class="frame f5">
<g transform="rotate(11.25 187 255)"><circle cx="187" cy="255" r="53" fill="#253e55" stroke="#aebed0" stroke-width="2"/><path d="M187 202 A53 53 0 0 1 187 308Z" fill="#437e93"/><text x="161" y="262" font-size="19">S</text><text x="203" y="262" font-size="19">N</text><path d="M187 251V188m-7 10 7-10 7 10" stroke="#f2bd68" stroke-width="4" fill="none"/></g>
<text x="390" y="180" class="value">11.25°</text><text x="390" y="216" class="muted">Count 128 / 4096 · sample 5 of 5</text>
<text x="390" y="336" class="value" style="fill:#8be0ba">371.25°</text><text x="390" y="372" class="muted">One revolution + current angle</text>
</g>
<text x="32" y="433" class="muted">At the crossing: 0 − 4032 = −4032 counts → add 4096 counts to the total.</text>
<text x="32" y="463" class="muted">Default full-turn mapping · zero at count 0 · inversion off · forward motion already tracked</text>
</svg>
